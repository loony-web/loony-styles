name: Release

# Publishing to npm is paused while the project focuses on local development
# (see docs/TODO.md, "Deferred: publishing"). Run manually when that resumes.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Need full history for changesets to determine changed packages
          fetch-depth: 0

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests (must pass before release)
        run: pnpm test

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # When changesets are present: create/update a "Version Packages" PR
          # When merging the Version PR: publish to npm
          publish: pnpm changeset:publish
          version: pnpm changeset:version
          commit: "chore: release packages"
          title: "chore: release packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
