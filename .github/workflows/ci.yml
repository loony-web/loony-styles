name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint + format check
        run: pnpm biome check .

      - name: TypeScript type check
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo builds each package's workspace dependencies first (^build).
      - name: Run tests with coverage thresholds
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: packages/*/coverage
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # Runtime-only failures (e.g. a server component calling a client export)
      # pass the build but render as 500s; crawl every docs page to catch them.
      - name: Smoke-test docs pages
        run: pnpm --filter @loony/docs smoke

      - name: Check bundle sizes
        run: |
          echo "### Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          for pkg in packages/*/dist; do
            if [ -d "$pkg" ]; then
              size=$(du -sh "$pkg" | cut -f1)
              pkg_name=$(echo "$pkg" | cut -d'/' -f2)
              echo "| @loony/$pkg_name | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook --filter=@loony/docs

      - name: Upload Storybook artifacts
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/docs/storybook-static
          retention-days: 7

  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run accessibility tests
        run: pnpm test --filter=@loony/ui -- --reporter=verbose -t a11y
