name: Canary Release

on:
  push:
    branches: [develop]

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 20

jobs:
  canary:
    name: Publish Canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # Snapshot releases version packages as 0.0.0-canary-<timestamp> without
      # touching .changeset/pre.json, so nothing leaks back into the repo.
      - name: Check for pending changesets
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" | grep -q .; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pending changesets — skipping canary publish."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages as canary snapshot
        if: steps.changesets.outputs.pending == 'true'
        run: pnpm changeset version --snapshot canary

      - name: Build snapshot versions
        if: steps.changesets.outputs.pending == 'true'
        run: pnpm build

      - name: Publish canary packages
        if: steps.changesets.outputs.pending == 'true'
        run: pnpm changeset publish --tag canary --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
