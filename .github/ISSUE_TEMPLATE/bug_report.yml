name: Bug Report
description: Report a bug in a Loony component or tool
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

  - type: input
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      placeholder: e.g. Button, Dialog, Input
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Import Button from @loony/ui
        2. Render with loading={true}
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "@loony/ui@0.1.0"
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: Browser(s)
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other

  - type: dropdown
    id: a11y
    attributes:
      label: Accessibility impact?
      description: Does this affect keyboard navigation, screen readers, or ARIA?
      options:
        - "No"
        - "Yes - keyboard navigation"
        - "Yes - screen reader"
        - "Yes - ARIA attributes"
        - "Yes - focus management"
